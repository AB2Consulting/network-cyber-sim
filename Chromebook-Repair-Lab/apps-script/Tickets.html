<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Repair Lab — Tickets</title>
  <style>
    :root {
      --bg: #050508;
      --card: #0d0d18;
      --border: rgba(0,243,255,0.25);
      --cyan: #00f3ff;
      --pink: #ff00ff;
      --yellow: #ffcc00;
      --text: #e8e8ff;
      --muted: rgba(255,255,255,0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.5em;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan);
    }
    header p {
      margin-top: 6px;
      font-size: 0.8em;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
    /* ── Panels ── */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
    }
    .panel-title {
      font-size: 0.7em;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    /* ── Form ── */
    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.72em;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.95em;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0,243,255,0.2);
    }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 80px; font-family: inherit; }
    /* Fix type radio group */
    .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .radio-label {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9em;
      text-transform: none;
      letter-spacing: normal;
      color: var(--text);
    }
    .radio-label input { accent-color: var(--cyan); width: 16px; height: 16px; flex-shrink: 0; }
    .radio-label:has(input:checked) {
      border-color: var(--cyan);
      background: rgba(0,243,255,0.08);
      color: var(--cyan);
    }
    #description-field { display: none; }
    /* Submit */
    .submit-btn {
      width: 100%; padding: 15px;
      border: 2px solid var(--cyan); border-radius: 6px;
      background: transparent; color: var(--cyan);
      font-size: 0.9em; font-weight: 700;
      letter-spacing: 3px; text-transform: uppercase;
      cursor: pointer; transition: all 0.25s; margin-top: 6px;
    }
    .submit-btn:hover {
      background: var(--cyan); color: #000;
      box-shadow: 0 0 24px rgba(0,243,255,0.4);
    }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    /* Feedback */
    #feedback {
      margin-top: 16px; padding: 12px 16px;
      border-radius: 6px; font-size: 0.85em; text-align: center;
      display: none; letter-spacing: 1px;
    }
    #feedback.success {
      display: block; background: rgba(0,255,100,0.08);
      border: 1px solid rgba(0,255,100,0.3); color: #00ff88;
    }
    #feedback.error {
      display: block; background: rgba(255,0,80,0.08);
      border: 1px solid rgba(255,0,80,0.3); color: var(--pink);
    }
    /* ── Ticket List ── */
    .ticket-list { display: flex; flex-direction: column; gap: 12px; }
    .ticket-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px;
    }
    .ticket-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }
    .ticket-id {
      font-size: 0.7em; letter-spacing: 2px; color: var(--cyan);
      font-weight: 700;
    }
    .badge {
      font-size: 0.65em; padding: 3px 10px; border-radius: 20px;
      font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    }
    .badge.open         { background: rgba(0,243,255,0.15); color: var(--cyan); }
    .badge.in-progress  { background: rgba(255,204,0,0.15); color: var(--yellow); }
    .ticket-meta { font-size: 0.8em; color: var(--muted); margin-bottom: 4px; }
    .ticket-fix  { font-size: 0.85em; color: var(--text); }
    .ticket-actions { margin-top: 10px; display: flex; gap: 8px; }
    .ticket-btn {
      flex: 1; padding: 7px; font-size: 0.7em; letter-spacing: 1px;
      text-transform: uppercase; border-radius: 4px; cursor: pointer;
      font-weight: 600; transition: all 0.2s; border: 1px solid;
      background: transparent;
    }
    .btn-progress { border-color: var(--yellow); color: var(--yellow); }
    .btn-progress:hover { background: var(--yellow); color: #000; }
    .btn-close    { border-color: var(--pink); color: var(--pink); }
    .btn-close:hover { background: var(--pink); color: #000; }
    .no-tickets { text-align: center; padding: 30px; color: var(--muted); font-size: 0.85em; letter-spacing: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>Repair Lab</h1>
    <p>Ticket Management</p>
  </header>

  <div class="layout">
    <!-- Create Ticket -->
    <div class="panel">
      <div class="panel-title">New Ticket</div>

      <div class="field">
        <label>Assigned Technician</label>
        <select id="technician">
          <option value="">Loading active students…</option>
        </select>
      </div>

      <div class="field">
        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Full name" autocomplete="off" />
      </div>

      <div class="field">
        <label>Customer Student ID</label>
        <input type="text" id="customerId" placeholder="ID number" autocomplete="off" />
      </div>

      <div class="field">
        <label>Type of Fix</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="fixType" value="Screen" /> Screen</label>
          <label class="radio-label"><input type="radio" name="fixType" value="Battery" /> Battery</label>
          <label class="radio-label"><input type="radio" name="fixType" value="Charger" /> Charger</label>
          <label class="radio-label"><input type="radio" name="fixType" value="Other" id="otherRadio" /> Other</label>
        </div>
      </div>

      <div class="field" id="description-field">
        <label>Please describe the issue</label>
        <textarea id="description" placeholder="Describe the problem…"></textarea>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitTicket()">Create Ticket</button>
      <div id="feedback"></div>
    </div>

    <!-- Open Tickets -->
    <div class="panel">
      <div class="panel-title">Open Tickets</div>
      <div id="ticket-list" class="ticket-list">
        <div class="no-tickets">Loading…</div>
      </div>
    </div>
  </div>

  <script>
    // ── Fix Type — show description if Other ──
    document.querySelectorAll('input[name="fixType"]').forEach(r => {
      r.addEventListener('change', () => {
        document.getElementById('description-field').style.display =
          r.value === 'Other' && r.checked ? 'block' : 'none';
      });
    });

    // ── Load technicians dropdown ──
    function loadTechnicians() {
      google.script.run
        .withSuccessHandler(names => {
          const sel = document.getElementById('technician');
          if (!names || names.length === 0) {
            sel.innerHTML = '<option value="">No students clocked in</option>';
            return;
          }
          sel.innerHTML = '<option value="">Select technician…</option>' +
            names.map(n => '<option value="' + n + '">' + n + '</option>').join('');
        })
        .withFailureHandler(() => {
          document.getElementById('technician').innerHTML =
            '<option value="">Error loading — refresh page</option>';
        })
        .getActiveStudents();
    }

    // ── Submit ticket ──
    function submitTicket() {
      const tech = document.getElementById('technician').value.trim();
      const name = document.getElementById('customerName').value.trim();
      const id   = document.getElementById('customerId').value.trim();
      const fix  = document.querySelector('input[name="fixType"]:checked');

      if (!tech || !name || !id || !fix) {
        showFeedback('Please fill out all required fields.', 'error');
        return;
      }

      const desc = fix.value === 'Other' ? document.getElementById('description').value.trim() : '';

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Creating…';

      google.script.run
        .withSuccessHandler(res => {
          showFeedback('✓ ' + res.message, 'success');
          btn.disabled = false;
          btn.textContent = 'Create Ticket';
          resetForm();
          loadTickets();
        })
        .withFailureHandler(err => {
          showFeedback('Error: ' + err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Create Ticket';
        })
        .createTicket({ technician: tech, customerName: name, customerId: id, fixType: fix.value, description: desc });
    }

    function resetForm() {
      document.getElementById('customerName').value = '';
      document.getElementById('customerId').value   = '';
      document.querySelectorAll('input[name="fixType"]').forEach(r => r.checked = false);
      document.getElementById('description').value  = '';
      document.getElementById('description-field').style.display = 'none';
    }

    function showFeedback(msg, type) {
      const fb = document.getElementById('feedback');
      fb.textContent = msg;
      fb.className   = type;
      fb.style.display = 'block';
      if (type === 'success') setTimeout(() => { fb.style.display = 'none'; }, 5000);
    }

    // ── Load & render open tickets ──
    function loadTickets() {
      google.script.run
        .withSuccessHandler(renderTickets)
        .withFailureHandler(err => {
          document.getElementById('ticket-list').innerHTML =
            '<div class="no-tickets" style="color:#ff6666;">Error: ' + err.message + '</div>';
        })
        .getOpenTickets();
    }

    function renderTickets(tickets) {
      const list = document.getElementById('ticket-list');
      if (!tickets || tickets.length === 0) {
        list.innerHTML = '<div class="no-tickets">No open tickets — great job! ✓</div>';
        return;
      }
      list.innerHTML = tickets.map(t => {
        const badgeClass = t.status.toLowerCase().replace(' ', '-');
        const date = t.timestamp ? new Date(t.timestamp).toLocaleDateString() : '—';
        return '<div class="ticket-card">' +
          '<div class="ticket-header">' +
            '<span class="ticket-id">' + t.ticketId + '</span>' +
            '<span class="badge ' + badgeClass + '">' + t.status + '</span>' +
          '</div>' +
          '<div class="ticket-meta">' + date + ' · Tech: ' + t.technician + '</div>' +
          '<div class="ticket-fix">' + t.customerName + ' — ' + t.fixType +
            (t.description ? ': ' + t.description : '') + '</div>' +
          '<div class="ticket-actions">' +
            (t.status === 'Open' ?
              '<button class="ticket-btn btn-progress" onclick="changeStatus(\'' + t.ticketId + '\',\'In Progress\')">In Progress</button>' : '') +
            '<button class="ticket-btn btn-close" onclick="changeStatus(\'' + t.ticketId + '\',\'Closed\')">Close</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function changeStatus(ticketId, newStatus) {
      google.script.run
        .withSuccessHandler(() => loadTickets())
        .withFailureHandler(err => alert('Error: ' + err.message))
        .updateTicketStatus(ticketId, newStatus);
    }

    // Init
    loadTechnicians();
    loadTickets();
    setInterval(loadTickets, 30000);
  </script>
</body>
</html>
