<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Repair Lab Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Courier New', monospace;
      color: #00ff00;
      overflow: hidden;
    }
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      background: rgba(0,0,0,0.35);
    }
    /* Header */
    #header {
      text-align: center;
    }
    #header h1 {
      font-size: clamp(2em, 5vw, 3.5em);
      text-shadow: 0 0 12px #00ff00;
      background: rgba(0,0,0,0.7);
      padding: 12px 40px;
      border: 1px solid #00ff00;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    #ticket-banner {
      margin-top: 12px;
      font-size: clamp(0.9em, 2vw, 1.3em);
      color: #ffff00;
      text-shadow: 0 0 8px #aaaa00;
      letter-spacing: 2px;
      background: rgba(0,0,0,0.6);
      padding: 6px 24px;
      border: 1px solid rgba(255,255,0,0.3);
    }
    /* Student Cards */
    #active-list {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      justify-content: center;
      max-width: 90vw;
    }
    .student-card {
      background: rgba(0,20,0,0.85);
      border: 1px solid #00ff00;
      padding: 22px 30px;
      min-width: 200px;
      max-width: 240px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,255,0,0.15);
      animation: pulse 4s ease-in-out infinite;
      border-radius: 4px;
    }
    .student-name {
      font-size: clamp(1em, 2.5vw, 1.5em);
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .student-time {
      font-size: 0.85em;
      color: #00cc00;
    }
    .empty-msg {
      color: rgba(0,255,0,0.5);
      font-size: 1.4em;
      letter-spacing: 3px;
      border: 1px dashed rgba(0,255,0,0.2);
      padding: 20px 40px;
      background: rgba(0,0,0,0.5);
    }
    .closed-msg {
      color: #ff4444;
      font-size: clamp(1.2em, 3vw, 2em);
      border: 2px solid #ff4444;
      padding: 20px 40px;
      background: rgba(20,0,0,0.8);
      text-align: center;
      letter-spacing: 4px;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0,255,0,0.15); }
      50%       { box-shadow: 0 0 35px rgba(0,255,0,0.45); border-color: #00ff88; }
    }
    /* Clock */
    #clock {
      position: fixed;
      bottom: 20px; right: 28px;
      font-size: 1.1em;
      color: rgba(0,255,0,0.5);
      z-index: 3;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <div id="header">
      <h1>Chromebook Repair Lab</h1>
      <div id="ticket-banner">⚡ Open Tickets: <span id="ticket-count">—</span></div>
    </div>
    <div id="active-list">
      <div class="student-card"><div class="student-name">Initializing...</div></div>
    </div>
  </div>

  <div id="clock"></div>

  <script>
    // ── Matrix Rain ──────────────────────────────
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars  = 'アァカサタナ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const fs     = 16;
    let drops    = [];
    function initDrops() {
      drops = Array(Math.floor(canvas.width / fs)).fill(1);
    }
    initDrops();
    window.addEventListener('resize', initDrops);

    setInterval(() => {
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0F0';
      ctx.font      = fs + 'px monospace';
      drops.forEach((y, i) => {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs, y * fs);
        if (y * fs > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }, 33);

    // ── Clock ────────────────────────────────────
    const clockEl = document.getElementById('clock');
    function updateClock() {
      clockEl.textContent = new Date().toLocaleTimeString();
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ── Student Data ─────────────────────────────
    function refresh() {
      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(err => {
          document.getElementById('active-list').innerHTML =
            '<div class="closed-msg">SYSTEM ERROR: ' + err.message + '</div>';
        })
        .getScreensaverData();
    }

    function render(data) {
      const list        = document.getElementById('active-list');
      const ticketCount = document.getElementById('ticket-count');

      if (!data) { list.innerHTML = '<div class="closed-msg">NO DATA</div>'; return; }

      ticketCount.textContent = data.openTickets != null ? data.openTickets : '—';

      if (data.status === 'CLOSED') {
        list.innerHTML = '<div class="closed-msg">' + (data.message || 'LAB CLOSED') + '</div>';
        return;
      }

      if (!data.students || data.students.length === 0) {
        list.innerHTML = '<div class="empty-msg">NO ACTIVE TECHNICIANS</div>';
        return;
      }

      list.innerHTML = '';
      data.students.forEach(s => {
        const card = document.createElement('div');
        card.className = 'student-card';
        const since = new Date(s.since);
        card.innerHTML =
          '<div class="student-name">' + s.name + '</div>' +
          '<div class="student-time">Since ' + since.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</div>';
        list.appendChild(card);
      });
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
