<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <style>
        /* THEME */
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #c9d1d9;
            --accent: #d29922;
            /* Sending Color (Yellow) */
            --success: #238636;
            /* Receiving Color (Green) */
            --error: #da3633;
            --border: #30363d;
            --inactive: #21262d;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
        }

        /* MODE SWITCH - IMPROVED VISIBILITY */
        .switch-container {
            display: flex;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px;
            margin-bottom: 20px;
            gap: 5px;
        }

        .option {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
            border: 2px solid transparent;
            /* default */
            background: var(--inactive);
            /* Dim background by default */
            color: #8b949e;
            /* Dim text by default */
        }

        .option:hover {
            background: #30363d;
        }

        /* ACTIVE Sending State */
        .option[data-mode="send"].active {
            background: var(--accent);
            color: #0d1117;
            /* Dark Text */
            border-color: var(--accent);
        }

        /* ACTIVE Receiving State */
        .option[data-mode="receive"].active {
            background: var(--success);
            color: #fff;
            /* White Text */
            border-color: var(--success);
        }

        .scan-area {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .scan-area.mode-send {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(210, 153, 34, 0.1);
        }

        .scan-area.mode-receive {
            border-color: var(--success);
            box-shadow: 0 0 10px rgba(35, 134, 54, 0.1);
        }

        input {
            background: #000;
            border: 2px solid var(--border);
            color: white;
            padding: 20px;
            font-size: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            font-family: monospace;
            text-align: center;
            margin-top: 10px;
        }

        input:focus {
            outline: none;
            border-color: white;
        }

        .log-container {
            flex: 1;
            margin-top: 20px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .log-item {
            padding: 10px;
            background: var(--card);
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            border-left: 5px solid #555;
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .log-item.send {
            border-left-color: var(--accent);
        }

        .log-item.receive {
            border-left-color: var(--success);
        }

        .log-item.error {
            border-left-color: var(--error);
        }

        .stat-row {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Reconditioning</h1>
        <div style="font-size:12px; color:#aaa">Management</div>
    </header>

    <div class="switch-container">
        <div class="option active" data-mode="send" onclick="setMode('send')">
            📤 SEND OUT
        </div>
        <div class="option" data-mode="receive" onclick="setMode('receive')">
            📥 RECEIVE BACK
        </div>
    </div>

    <div class="scan-area mode-send" id="scan-box">
        <h2 id="prompt-text">Scan Item to Send</h2>
        <input type="text" id="scan-input" placeholder="Scan Barcode..." autofocus>
    </div>

    <div class="log-container" id="log"></div>

    <script>
        let currentMode = 'send';

        function setMode(mode) {
            currentMode = mode;

            // Update Buttons
            document.querySelectorAll('.option').forEach(el => el.classList.remove('active'));
            document.querySelector(`.option[data-mode="${mode}"]`).classList.add('active');

            // Update Prompt & Box Color
            const prompt = mode === 'send' ? 'Scan Item to Send' : 'Scan Item to Receive';
            document.getElementById('prompt-text').innerText = prompt;

            const box = document.getElementById('scan-box');
            box.className = 'scan-area'; // reset
            box.classList.add(mode === 'send' ? 'mode-send' : 'mode-receive');

            const input = document.getElementById('scan-input');
            input.value = '';
            input.focus();
        }

        const input = document.getElementById('scan-input');
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const tag = this.value;
                if (!tag) return;
                this.value = '';

                google.script.run
                    .withSuccessHandler(item => addLog(item.name, tag, currentMode))
                    .withFailureHandler(err => addLog(err.message, tag, 'error'))
                    .apiSetReconditioning(tag, currentMode);
            }
        });

        function addLog(itemName, tag, type) {
            const log = document.getElementById('log');
            let msg = '';
            let icon = '';

            if (type === 'send') {
                msg = `Sent: ${itemName}`;
                icon = '📤';
            } else if (type === 'receive') {
                msg = `Received: ${itemName}`;
                icon = '✅';
            } else {
                msg = `Error: ${itemName}`;
                icon = '❌';
            }

            const html = `
            <div class="log-item ${type}">
                <div>
                   <div style="font-weight:bold">${icon} ${msg}</div>
                   <div class="stat-row">Tag: ${tag}</div>
                </div>
                <div style="font-size:12px; opacity:0.5">${new Date().toLocaleTimeString()}</div>
            </div>
        `;
            log.insertAdjacentHTML('afterbegin', html);
        }
    </script>
</body>

</html>
